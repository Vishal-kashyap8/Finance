trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  vmImageName: 'ubuntu-latest'
  azureSubscription: 'Finance-connection'
  resourceGroupName: 'finance-rg'
  location: 'centralindia'
  appServicePlanName: 'finance-app-plan'
  webAppName: 'finance-app-001'
  terraformVersion: '1.9.5'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/Infrastructure'
  appPackagePath: '$(Build.SourcesDirectory)/finance-app.zip'

stages:
  - stage: Infrastructure
    displayName: Provision Azure Infrastructure
    jobs:
      - job: Terraform
        displayName: Apply Terraform
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Verify Azure access
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az account show --output table

          - script: |
              cd "$(terraformWorkingDirectory)"
              terraform init -input=false
              terraform validate
              terraform plan -input=false -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" -out=tfplan
            displayName: Terraform plan
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)

          - script: |
              cd "$(terraformWorkingDirectory)"
              terraform apply -input=false -auto-approve -var="subscription_id=$(ARM_SUBSCRIPTION_ID)" tfplan
            displayName: Terraform apply
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)

  - stage: Application
    displayName: Deploy Application to Azure App Service
    dependsOn: Infrastructure
    condition: succeeded()
    jobs:
      - job: DeployApp
        displayName: Deploy Node.js app
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js 20
            inputs:
              versionSpec: '20.x'

          - script: |
              set -e
              mkdir -p "$(Build.SourcesDirectory)/release"
              cp -R "$(Build.SourcesDirectory)/backend/." "$(Build.SourcesDirectory)/release/"
              cp -R "$(Build.SourcesDirectory)/frontend" "$(Build.SourcesDirectory)/release/"
              cp "$(Build.SourcesDirectory)/package.json" "$(Build.SourcesDirectory)/release/package.json"

              cd "$(Build.SourcesDirectory)/release"
              npm install --omit=dev
              zip -r "$(Build.SourcesDirectory)/finance-app.zip" .
            displayName: Build app package

          - task: AzureCLI@2
            displayName: Configure App Service settings
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp config appsettings set \
                  --name "$(webAppName)" \
                  --resource-group "$(resourceGroupName)" \
                  --settings \
                    PORT=8080 \
                    NODE_ENV=production \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                    WEBSITES_PORT=8080

                az webapp config set \
                  --name "$(webAppName)" \
                  --resource-group "$(resourceGroupName)" \
                  --linux-fx-version "NODE|20-lts" \
                  --startup-file "npm start"

          - task: AzureWebApp@1
            displayName: Deploy package to App Service
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: $(appPackagePath)
